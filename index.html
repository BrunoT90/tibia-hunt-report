<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Party Hunt Tracker — Histórico & Comparativos</title>
  <style>
    :root {
      --bg: #0c1017;
      --surface: #141b26;
      --surface-2: #1c2534;
      --border: #2a374d;
      --text: #e8eef7;
      --muted: #93a4bc;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.14);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.14);
      --blue: #38bdf8;
      --amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      line-height: 1.45;
    }

    .container { max-width: 1180px; margin: 0 auto; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    header h1 { font-size: 1.55rem; }
    .status { font-size: 0.85rem; color: var(--muted); }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }

    .card .label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .card .val {
      font-size: 1.45rem;
      font-weight: 700;
      margin-top: 6px;
    }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .panel h2 { font-size: 1.1rem; margin-bottom: 16px; }

    .pos { color: var(--green); }
    .neg { color: var(--red); }

    .bar-row { margin-bottom: 14px; }
    .bar-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    .bar-bg {
      height: 10px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      border-radius: 999px;
      background: var(--blue);
    }

    .bar-fill.pos { background: var(--green); }
    .bar-fill.neg { background: var(--red); }
    .bar-fill.amber { background: var(--amber); }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    th, td {
      padding: 11px 13px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: var(--surface-2);
      color: var(--muted);
      font-weight: 600;
    }

    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .badge.pos { background: var(--green-bg); color: var(--green); }
    .badge.neg { background: var(--red-bg); color: var(--red); }

    .hunt-breakdown {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .mini-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.86rem;
    }

    .mini-card strong { display: block; margin-bottom: 6px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Party Hunt — Histórico & Comparativos</h1>
      </div>
      <div class="status" id="syncStatus">Sincronizando...</div>
    </header>

    <section class="cards" id="summaryCards"></section>

    <section class="panel">
      <h2>Comparativo entre Hunts (Balance)</h2>
      <div id="huntComparison"></div>
    </section>

    <section class="panel">
      <h2>Comparativo por Jogador (Balance Acumulado)</h2>
      <div id="playerComparison"></div>
    </section>

    <section class="panel">
      <h2>Histórico de Sessões</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Início</th>
              <th>Duração</th>
              <th>Loot</th>
              <th>Supplies</th>
              <th>Balance</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <div id="sessionsDetail" style="margin-top: 20px;"></div>
    </section>
  </div>

  <script>
    const FALLBACK_HUNTS = [
      {
        id: "2026-11-21, 23:08:51__2026-11-22, 01:51:44",
        start: "2026-11-21, 23:08:51",
        end: "2026-11-22, 01:51:44",
        duration: "02:42h",
        lootType: "Leader",
        loot: 7947194,
        supplies: 2698740,
        balance: 5248454,
        players: [
          { name: "Lord Fugitivivo", isLeader: false, loot: 33798, supplies: 663371, balance: -629573, damage: 9494201, healing: 5552471 },
          { name: "Malz Criada", isLeader: false, loot: 1976708, supplies: 905670, balance: 1071038, damage: 8565090, healing: 1541772 },
          { name: "Steelhen", isLeader: true, loot: 5862597, supplies: 1004470, balance: 4858127, damage: 5495649, healing: 2826941 },
          { name: "Thor Isback", isLeader: false, loot: 74091, supplies: 125229, balance: -51138, damage: 11839399, healing: 423941 }
        ]
      },
      {
        id: "2026-11-21, 17:15:48__2026-11-21, 18:28:35",
        start: "2026-11-21, 17:15:48",
        end: "2026-11-21, 18:28:35",
        duration: "01:12h",
        lootType: "Leader",
        loot: 3566024,
        supplies: 1157858,
        balance: 2408166,
        players: [
          { name: "Lord Fugitivivo", isLeader: false, loot: 37724, supplies: 273346, balance: -235622, damage: 4484461, healing: 2286518 },
          { name: "Malz Criada", isLeader: false, loot: 1118470, supplies: 376106, balance: 742364, damage: 3838723, healing: 872432 },
          { name: "Steelhen", isLeader: true, loot: 2299971, supplies: 289762, balance: 2010209, damage: 3045340, healing: 586863 },
          { name: "Thor Isback", isLeader: false, loot: 109859, supplies: 218644, balance: -108785, damage: 5289427, healing: 909923 }
        ]
      }
    ];

    const fmt = (n) => Number(n || 0).toLocaleString("pt-BR");
    const fmtSigned = (n) => (n > 0 ? `+${fmt(n)}` : fmt(n));

    function render(hunts) {
      const totalHunts = hunts.length;
      const totalLoot = hunts.reduce((acc, h) => acc + h.loot, 0);
      const totalSupplies = hunts.reduce((acc, h) => acc + h.supplies, 0);
      const totalBalance = hunts.reduce((acc, h) => acc + h.balance, 0);

      document.getElementById("summaryCards").innerHTML = `
        <div class="card">
          <div class="label">Total de Hunts</div>
          <div class="val">${totalHunts}</div>
        </div>
        <div class="card">
          <div class="label">Loot Acumulado</div>
          <div class="val">${fmt(totalLoot)}</div>
        </div>
        <div class="card">
          <div class="label">Supplies Acumulados</div>
          <div class="val">${fmt(totalSupplies)}</div>
        </div>
        <div class="card">
          <div class="label">Balance Total</div>
          <div class="val ${totalBalance >= 0 ? "pos" : "neg"}">${fmtSigned(totalBalance)}</div>
        </div>
      `;

      const maxAbsHuntBalance = Math.max(1, ...hunts.map((h) => Math.abs(h.balance)));
      document.getElementById("huntComparison").innerHTML = hunts
        .map((h) => {
          const pct = Math.min(100, Math.round((Math.abs(h.balance) / maxAbsHuntBalance) * 100));
          const cls = h.balance >= 0 ? "pos" : "neg";
          return `
            <div class="bar-row">
              <div class="bar-meta">
                <span>${h.start} (${h.duration})</span>
                <strong class="${cls}">${fmtSigned(h.balance)}</strong>
              </div>
              <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
            </div>
          `;
        })
        .join("");

      const playerMap = new Map();
      for (const h of hunts) {
        for (const p of h.players || []) {
          const cur = playerMap.get(p.name) || { name: p.name, balance: 0, damage: 0, healing: 0 };
          cur.balance += p.balance;
          cur.damage += p.damage;
          cur.healing += p.healing;
          playerMap.set(p.name, cur);
        }
      }

      const playersSorted = Array.from(playerMap.values()).sort((a, b) => b.balance - a.balance);
      const maxAbsPlayerBalance = Math.max(1, ...playersSorted.map((p) => Math.abs(p.balance)));

      document.getElementById("playerComparison").innerHTML = playersSorted
        .map((p) => {
          const pct = Math.min(100, Math.round((Math.abs(p.balance) / maxAbsPlayerBalance) * 100));
          const cls = p.balance >= 0 ? "pos" : "neg";
          return `
            <div class="bar-row">
              <div class="bar-meta">
                <span>${p.name} <small style="color:var(--muted)">(Dmg: ${fmt(p.damage)} | Heal: ${fmt(p.healing)})</small></span>
                <strong class="${cls}">${fmtSigned(p.balance)}</strong>
              </div>
              <div class="bar-bg"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
            </div>
          `;
        })
        .join("");

      document.getElementById("historyBody").innerHTML = hunts
        .map((h) => `
          <tr>
            <td>${h.start}</td>
            <td>${h.duration}</td>
            <td>${fmt(h.loot)}</td>
            <td>${fmt(h.supplies)}</td>
            <td><span class="badge ${h.balance >= 0 ? "pos" : "neg"}">${fmtSigned(h.balance)}</span></td>
          </tr>
        `)
        .join("");

      document.getElementById("sessionsDetail").innerHTML = hunts
        .map((h) => `
          <div style="margin-bottom: 18px;">
            <div style="font-weight:600; margin-bottom:8px;">Sessão: ${h.start} → ${h.end} (${h.duration})</div>
            <div class="hunt-breakdown">
              ${(h.players || [])
                .map((p) => `
                  <div class="mini-card">
                    <strong>${p.name}${p.isLeader ? " (Leader)" : ""}</strong>
                    <div>Loot: ${fmt(p.loot)} | Supplies: ${fmt(p.supplies)}</div>
                    <div>Balance: <span class="${p.balance >= 0 ? "pos" : "neg"}"><strong>${fmtSigned(p.balance)}</strong></span></div>
                    <div style="color:var(--muted); margin-top:4px;">Damage: ${fmt(p.damage)} | Healing: ${fmt(p.healing)}</div>
                  </div>
                `)
                .join("")}
            </div>
          </div>
        `)
        .join("");
    }

    async function loadHunts() {
      try {
        const res = await fetch(`./hunts.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error("JSON não encontrado");
        const data = await res.json();
        render(Array.isArray(data) && data.length ? data : FALLBACK_HUNTS);
        document.getElementById("syncStatus").textContent =
          `Atualizado via hunts.json às ${new Date().toLocaleTimeString("pt-BR")}`;
      } catch {
        render(FALLBACK_HUNTS);
        document.getElementById("syncStatus").textContent =
          "Exibindo dados de exemplo (aguardando hunts.json)";
      }
    }

    loadHunts();
    setInterval(loadHunts, 15000);
  </script>
</body>
</html>
